[project]
name = "cosmos-retriever"
version = "0.1.0"
description = "Multi-turn Cosmos DB search agent (driven by any OpenAI-compatible model) as a Python library + CLI, designed to be invoked by the Azure Cosmos DB MCP Toolkit's `agentic_search` tool."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Cosmos Retriever Contributors" }]
keywords = ["retrieval", "rag", "cosmos-db", "vllm", "agent"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "anyio>=4.0,<5",
  "azure-cosmos>=4.7,<5",
  "azure-identity>=1.17,<2",
  "fastapi>=0.110,<1",
  "httpx>=0.27,<1",
  "json-repair>=0.20,<1",
  "openai>=1.40,<2",
  "openai-harmony>=0.0.8,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.4,<3",
  "structlog>=24,<26",
  "tenacity>=8.3,<10",
  "tiktoken>=0.7,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
baseten = ["baseten-performance-client>=0.4,<1"]
dev = [
  "mypy>=1.10,<2",
  "ruff>=0.6,<1",
]

[project.scripts]
cosmos-retriever = "cosmos_retriever.__main__:main"

[project.urls]
Homepage = "https://github.com/your-org/cosmos-retriever"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cosmos_retriever"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
# Retrieval error names are part of the public error model and intentionally
# do not use an "Error" suffix.
"src/cosmos_retriever/retrieval/errors.py" = ["N818"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
files = ["src/cosmos_retriever"]
